[project]
name = "fern"
version = "0.1.0"
description = "Distill a large teacher (DeepSeek V4 Flash) into a 4B Jev-style decision model on one GPU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate>=1.10",
    "datasets>=4.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "typer>=0.17",
    "numpy>=2.0",
    "flash-linear-attention>=0.5.2",
]

[project.scripts]
fern = "fern.cli:app"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
